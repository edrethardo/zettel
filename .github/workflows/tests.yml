# Die Suite läuft ohne Netz, ohne Modell, ohne Phoenix — genau das prüft sie
# (GATES.md). Deshalb braucht sie hier nichts als Python und requirements.txt.
name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -p no:cacheprovider
      - run: python checks/smoke.py
