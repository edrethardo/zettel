{% extends "basis.html" %}
{% block titel %}{{ t('rolle.titel') }} — Zettel{% endblock %}
{% block inhalt %}
<h1>{{ t('rolle.titel') }}</h1>
<p>{{ t('rolle.hinweis') }}</p>
<div class="rollen">
  <form method="post" action="/rolle?wer=sie">
    <button type="submit" {% if rolle == 'sie' %}class="gewaehlt"{% endif %}>
      {{ t('rolle.sie') }}</button>
  </form>
  <form method="post" action="/rolle?wer=er">
    <button type="submit" {% if rolle == 'er' %}class="gewaehlt"{% endif %}>
      {{ t('rolle.er') }}</button>
  </form>
</div>
{% endblock %}
