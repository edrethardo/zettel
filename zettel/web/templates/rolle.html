{% extends "basis.html" %}
{% block titel %}Wer bist du? — Zettel{% endblock %}
{% block inhalt %}
<h1>Wer bist du?</h1>
<p>
  Die Wahl steuert nur, womit die Startseite aufmacht. Sie ist keine Anmeldung
  und schützt nichts — der Shop steht im Tailnet und hat kein Passwort.
</p>
<div class="rollen">
  <form method="post" action="/rolle?wer=sie">
    <button type="submit" {% if rolle == 'sie' %}class="gewaehlt"{% endif %}>
      sie — fängt beim Katalog an</button>
  </form>
  <form method="post" action="/rolle?wer=er">
    <button type="submit" {% if rolle == 'er' %}class="gewaehlt"{% endif %}>
      er — fängt bei der Pick-Liste an</button>
  </form>
</div>
{% endblock %}
