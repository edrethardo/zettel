<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1004" width="720" height="1004" role="img" aria-label="Dumbbell chart: catalog hit rate per dish before and after the one-line fix, 76 to 83 percent overall">
<style>
  text { font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  .titel   { font-size: 15px; font-weight: 600; fill: #57606a; }
  .unter, .legende, .achse { font-size: 10.5px; fill: #6e7781; }
  .kopf    { font-size: 10.5px; font-weight: 600; fill: #6e7781; }
  .name    { font-size: 9.5px; fill: #6e7781; }
  .gitter  { stroke: #6e7781; stroke-opacity: .22; stroke-width: 1; }
  .l-auf   { stroke: #2a78d6; stroke-opacity: .45; stroke-width: 2; }
  .l-ab    { stroke: #eb6834; stroke-opacity: .45; stroke-width: 2; }
  .p-auf   { fill: #2a78d6; }
  .p-ab    { fill: #eb6834; }
  .p-vor   { fill: none; stroke-width: 1.6; }
  .p-vor.p-auf { stroke: #2a78d6; }
  .p-vor.p-ab  { stroke: #eb6834; }
  .p-still { fill: #6e7781; fill-opacity: .55; }
  @media (prefers-color-scheme: dark) {
    .titel { fill: #9198a1; }
    .unter, .legende, .achse, .kopf, .name { fill: #9198a1; }
    .gitter { stroke: #9198a1; }
    .l-auf { stroke: #3987e5; }
    .l-ab  { stroke: #d95926; }
    .p-auf { fill: #3987e5; }
    .p-ab  { fill: #d95926; }
    .p-vor { fill: none; }
    .p-vor.p-auf { stroke: #3987e5; }
    .p-vor.p-ab  { stroke: #d95926; }
    .p-still { fill: #9198a1; }
  }
</style>

